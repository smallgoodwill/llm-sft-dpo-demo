# DPO 超参（在 SFT 产出的 LoRA 上继续训练）
# 说明：与 run.py 默认值一致；TRL 版本不兼容时 run.py 会打印原因并跳过本阶段。

init_adapter: out/sft          # 从 SFT LoRA 继续
beta: 0.1                      # 偏好强度，越大越贴近参考模型
train:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  bf16: true
  gradient_checkpointing: true
  max_length: 1024
  max_prompt_length: 512
  seed: 42
